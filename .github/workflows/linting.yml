name: Linting

on: [pull_request, workflow_dispatch]

jobs:
  flake8_linting:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']

    name: Linting
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # For some reason, loading venv makes this way slower
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r devtools/dev-requirements.txt

      - name: flake8 Lint
        uses: reviewdog/action-flake8@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review

      - name: Check for unmarked tests
        if: ${{ !cancelled() }}
        run: python devtools/check_unmarked_tests.py tests/*.py

      - name: Check public API matches docs
        if: ${{ !cancelled() }}
        run: python devtools/check_public_api.py

      # Installed here rather than in dev-requirements.txt so its flake8
      # plugin doesn't affect the flake8 step above.
      - name: Check docstring parameters match signatures
        if: ${{ !cancelled() }}
        run: |
          pip install pydoclint==0.12.0
          pydoclint desc/
